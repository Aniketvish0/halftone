<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Halftone: break reminders that never interrupt</title>
  <meta name="description" content="Free, native break reminders for macOS. 0% CPU. Never interrupts a meeting.">
  <meta property="og:title" content="Halftone: break reminders that never interrupt">
  <meta property="og:description" content="Free, native break reminders for macOS. 0% CPU. Auto-detects calls, recording, and video. and waits.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://aniketvish0.github.io/halftone/">
  <meta property="og:image" content="https://aniketvish0.github.io/halftone/landing/shot-overlay.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='none' stroke='%23888' stroke-width='2'/%3E%3Cpath d='M12 2 A10 10 0 0 0 12 22 Z' fill='%23888'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="landing/style.css">
  <script>
    /* Pre-paint theme bootstrap: avoids a light-theme flash for night users. */
    (function () {
      var t = null;
      try { t = localStorage.getItem("halftone-theme"); } catch (e) {}
      if (["day", "afternoon", "night"].indexOf(t) === -1) {
        t = matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>

  <!-- Theme toggle -->
  <div class="theme-toggle" role="group" aria-label="Sky theme">
    <button type="button" data-set-theme="day" aria-label="Day theme" title="Day">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5.3 5.3l1.7 1.7M17 17l1.7 1.7M18.7 5.3L17 7M7 17l-1.7 1.7"/>
      </svg>
    </button>
    <button type="button" data-set-theme="afternoon" aria-label="Afternoon theme" title="Afternoon">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M7.5 15.5a4.5 4.5 0 1 1 9 0"/>
        <path d="M12 5.5v2.2M4.6 8.6l1.6 1.6M19.4 8.6l-1.6 1.6M2.5 15.5h3M18.5 15.5h3M3.5 19.5h17"/>
      </svg>
    </button>
    <button type="button" data-set-theme="night" aria-label="Night theme" title="Night">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/>
      </svg>
    </button>
  </div>

  <!-- Hero -->
  <div class="hero-wrap">
    <section class="hero">
      <div class="hero-frame" id="hero-frame">
        <div class="sky sky-day" aria-hidden="true">
          <div class="blob blob-a"></div>
          <div class="blob blob-b"></div>
          <div class="blob blob-c"></div>
        </div>
        <div class="sky sky-afternoon" aria-hidden="true">
          <div class="blob blob-a"></div>
          <div class="blob blob-b"></div>
          <div class="blob blob-c"></div>
        </div>
        <div class="sky sky-night" aria-hidden="true">
          <div class="stars"></div>
          <div class="blob blob-a"></div>
          <div class="blob blob-b"></div>
        </div>

        <div class="hero-content">
          <p class="brand">
            <svg class="glyph" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
              <path d="M12 2 A10 10 0 0 0 12 22 Z" fill="currentColor"/>
            </svg>
            Halftone
          </p>
          <h1>Look away.<br>Keep your flow.</h1>
          <p class="sub">Free, native break reminders for macOS. 0% CPU. Never interrupts a meeting.</p>
          <div class="cta">
            <a class="btn btn-light" href="https://github.com/Aniketvish0/halftone/releases/latest/download/Halftone.dmg">
              <svg viewBox="0 0 24 24" width="17" height="17" fill="currentColor" aria-hidden="true">
                <path d="M17.05 12.54c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.09-2.01-3.76-2.04-1.6-.16-3.12.94-3.93.94-.8 0-2.06-.92-3.39-.89-1.74.03-3.35 1.01-4.25 2.57-1.81 3.14-.46 7.79 1.3 10.34.86 1.25 1.89 2.65 3.24 2.6 1.3-.05 1.79-.84 3.36-.84 1.57 0 2.01.84 3.39.81 1.4-.02 2.29-1.27 3.15-2.52.99-1.45 1.4-2.85 1.42-2.92-.03-.01-2.72-1.04-2.75-4.14zM14.46 4.9c.71-.86 1.19-2.06 1.06-3.26-1.02.04-2.26.68-2.99 1.54-.66.76-1.24 1.98-1.08 3.15 1.14.09 2.3-.58 3.01-1.43z"/>
              </svg>
              Download for Mac
            </a>
            <a class="btn btn-dark" href="https://github.com/Aniketvish0/halftone">
              <svg viewBox="0 0 16 16" width="17" height="17" fill="currentColor" aria-hidden="true">
                <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
              </svg>
              View on GitHub
            </a>
          </div>
          <p class="fineprint">macOS 26+ &middot; Apple silicon &middot; MIT</p>
        </div>
      </div>
    </section>
  </div>

  <!-- Screenshots -->
  <section class="shots">
    <figure class="shot">
      <div class="shot-frame">
        <img src="landing/shot-overlay.png" alt="Halftone full-screen break overlay with countdown" loading="lazy" onerror="this.closest('.shot-frame').hidden=true">
      </div>
      <figcaption>Full-screen breaks with a live countdown, on every display.</figcaption>
    </figure>
    <figure class="shot">
      <div class="shot-frame">
        <img src="landing/shot-pill.png" alt="Halftone warning pill with snooze button" loading="lazy" onerror="this.closest('.shot-frame').hidden=true">
      </div>
      <figcaption>A quiet heads-up before each break. Snooze if you're mid-thought.</figcaption>
    </figure>
    <figure class="shot">
      <div class="shot-frame">
        <img src="landing/shot-menubar.png" alt="Halftone menu bar icon and menu" loading="lazy" onerror="this.closest('.shot-frame').hidden=true">
      </div>
      <figcaption>Lives in the menu bar. Shows a person icon when it sees your call and holds the break.</figcaption>
    </figure>
  </section>

          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>

        View on GitHub

    </div>
    <p>Free &amp; open source &middot; MIT &middot; Built for macOS</p>

  <script src="landing/script.js"></script>
</body>
</html>
